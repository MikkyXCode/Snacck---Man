<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/icon.png" type="image/x-icon">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Snack Man!</h1>
    </header>

    <div class="start">
        <img src="images/icon.png" alt="logo">
        <h1>Start</h1>
    </div>

    <!-- gameover screen section added to the HTML -->
    <div id="gameOverScreen" style="display:none;">
        <h1 id="gameOverMessage"></h1>
        <p id="finalScore"></p>
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="12" />
        <button id="saveScoreBtn">Save Score</button>
        <button id="resetBtn">Reset</button>
    </div>

    <!-- editted the leaderboard section so it can be populated by the script -->
    <div class="leaderboard">
        <h1>LeaderBoard:</h1>
        <ol id="leaderboardList"></ol>

    </div>

    <main>
    </main>

    <div class="lives">
        <h1>Lives:</h1>
        <ul id="livesList"></ul>
    </div>

    <div class="score">
        <h1>Score:</h1>
        <p>0</p>
    </div>

    <div class="controls">
        <button id="lbttn">&#9664;</button> <!-- LEFT -->
        <button id="ubttn">&#9650;</button> <!-- UP -->
        <button id="rbttn">&#9654;</button> <!-- RIGHT -->
        <button id="dbttn">&#9660;</button> <!-- DOWN -->
    </div>

</body>

</html>
